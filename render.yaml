# Render Blueprint for the Vatsa AI backend: Docker (Backend/Dockerfile),
# free plan, external Neon Postgres + Upstash Redis. `sync: false` values are
# set in the dashboard, never in Git. The app refuses to start if a required
# secret is missing, malformed or a value that leaked in git history
# (Backend/app/core/secrets_check.py), so Render keeps the previous deploy.
services:
  - type: web
    name: vatsaai-backend
    runtime: docker
    region: singapore
    plan: free
    dockerfilePath: ./Backend/Dockerfile
    dockerContext: ./Backend
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: ENV
        value: production
      # Same meaning as ENV for the startup secrets check.
      - key: APP_ENV
        value: production
      # One proxy (Render's) appends to X-Forwarded-For; rate limits trust it.
      - key: TRUSTED_PROXY_COUNT
        value: "1"
      # Fernet key for 2FA secrets at rest. Required in production.
      - key: DATA_ENCRYPTION_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: EMAIL_USERNAME
        sync: false
      - key: EMAIL_PASSWORD
        sync: false
      - key: EMAIL_SMTP_HOST
        value: smtp.gmail.com
      - key: EMAIL_SMTP_PORT
        value: "587"
      - key: MAIL_FROM
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        value: https://api.vatsaai.com/api/auth/google/callback
      # Settings -> Connect Google. Must also be an authorized redirect URI.
      - key: GOOGLE_LINK_REDIRECT_URI
        sync: false
      # CAPTCHA on starting a Google/GitHub sign-in (DEPLOY.md §6). Set in the
      # dashboard, not here, so turning it on/off survives a Blueprint sync.
      # Unset = off.
      - key: TURNSTILE_ENABLED
        sync: false
      - key: TURNSTILE_SECRET_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        value: https://vatsaai.com,https://www.vatsaai.com
      - key: BACKEND_PUBLIC_URL
        value: https://api.vatsaai.com
      - key: FRONTEND_REDIRECT_URL
        value: https://vatsaai.com
      - key: STORAGE_BACKEND
        value: local
      - key: DB_POOL_SIZE
        value: "2"
      - key: DB_MAX_OVERFLOW
        value: "2"
      - key: DB_POOL_RECYCLE_SECONDS
        value: "300"
      - key: CACHE_ENABLED
        value: "true"
      - key: ADMIN_EMAILS
        sync: false
