# Render Blueprint for the Vatsa AI backend (FastAPI in Backend/).
# Render reads this file from the repository ROOT. Dashboard -> New ->
# Blueprint -> pick bv4623-svg/Vatsa-_ai -> Apply. See DEPLOY.md.
#
# `sync: false` variables are asked for in the dashboard during the first
# Apply and are never stored in Git. The backend refuses to start if a
# required one is missing, malformed or still a value that leaked in git
# history (Backend/app/core/secrets_check.py).
services:
  - type: web
    name: vatsaai-backend
    runtime: python
    rootDir: Backend
    # Singapore is the closest Render region to India.
    region: singapore
    # The SQLite database, uploads and generated images live on the disk
    # below; Render only offers persistent disks on paid instance types.
    plan: starter
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    # The pre-deploy check (secrets, database, data dir) runs first; if it
    # fails, uvicorn never starts, the health check fails and Render keeps
    # the previous deploy live. --proxy-headers: behind Render's HTTPS proxy.
    startCommand: python -m scripts.predeploy_check && uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips="*"
    healthCheckPath: /health
    disk:
      name: vatsa-data
      mountPath: /data
      sizeGB: 5
    envVars:
      # The version CI tests on (Backend/runtime.txt, .github/workflows/ci.yml).
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: APP_ENV
        value: production
      - key: DATA_DIR
        value: /data
      # One proxy (Render's) appends to X-Forwarded-For; rate limits trust it.
      - key: TRUSTED_PROXY_COUNT
        value: "1"
      # --- required secrets ---
      # Generated by Render on the first Apply (a fresh value, never the
      # leaked one). Regenerate in the dashboard to rotate; it signs everyone out.
      - key: JWT_SECRET_KEY
        generateValue: true
      # A Fernet key: python -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())"
      - key: DATA_ENCRYPTION_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      # --- required URLs ---
      # https origin(s) of the Netlify site, e.g. https://vatsaai.netlify.app
      - key: ALLOWED_ORIGINS
        sync: false
      - key: FRONTEND_REDIRECT_URL
        sync: false
      # This service's own https URL, e.g. https://vatsaai-backend.onrender.com
      - key: BACKEND_PUBLIC_URL
        sync: false
      # --- payments (Razorpay) ---
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      # --- email (OTP codes, notices) ---
      - key: EMAIL_USERNAME
        sync: false
      - key: EMAIL_PASSWORD
        sync: false
      - key: MAIL_FROM
        sync: false
      # --- optional: OAuth sign-in (leave blank to hide the button) ---
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      # Required with GOOGLE_CLIENT_ID; blank breaks sign-in. Both must also be
      # authorized redirect URIs on the Google OAuth client.
      # https://<this service>/auth/google/callback
      - key: GOOGLE_REDIRECT_URI
        sync: false
      # https://<this service>/auth/google/link/callback (Settings -> Connect Google)
      - key: GOOGLE_LINK_REDIRECT_URI
        sync: false
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      - key: MICROSOFT_CLIENT_ID
        sync: false
      - key: MICROSOFT_CLIENT_SECRET
        sync: false
      # --- optional: extra search providers (DuckDuckGo always works) ---
      - key: SERPER_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      - key: BRAVE_API_KEY
        sync: false
      # Comma-separated emails allowed to use /api/admin/*. Empty disables it.
      - key: ADMIN_EMAILS
        sync: false
